<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PatternSpy</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="header-content">
                    <h1 class="title">PatternSpy</h1>
                </div>
                <div class="date-display">
                    <div class="current-date" id="currentDate"></div>
                    <div class="current-day" id="currentDay"></div>
                </div>
            </header>

            <section class="add-habit-section">
                <h2 class="section-title">Log Today's Habit</h2>
                <form id="habitForm" class="habit-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="habit">Habit Name</label>
                            <input type="text" id="habit" placeholder="e.g., Morning Exercise" required />
                        </div>
                        <div class="form-group">
                            <label for="timeSpent">Time Spent (hours)</label>
                            <input type="number" id="timeSpent" placeholder="1.5" step="0.1" min="0" max="24" required />
                        </div>
                        <button type="submit" class="btn-primary">
                            <span class="btn-text">Add Entry</span>
                            <span class="btn-icon">→</span>
                        </button>
                    </div>
                </form>
            </section>

            <section class="charts-section">
                <h2 class="section-title">Weekly Overview</h2>
                <div class="chart-container">
                    <div id="weeklyChart"></div>
                </div>
            </section>

            <section class="logs-section">
                <div class="logs-header">
                    <h2 class="section-title">Recent Activity</h2>
                    <button id="clearAll" class="btn-secondary">Clear All Data</button>
                </div>
                <div class="table-wrapper">
                    <table id="habitTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Day</th>
                                <th>Habit</th>
                                <th>Time (hrs)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Habit logs will appear here -->
                        </tbody>
                    </table>
                    <div id="emptyState" class="empty-state">
                        <div class="empty-icon">📊</div>
                        <p>No habits tracked yet. Start logging your progress!</p>
                    </div>
                </div>
            </section>
        </div>

        <script src="script.js"></script>
    </body>
</html>
