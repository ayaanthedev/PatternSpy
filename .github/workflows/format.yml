name: Auto Format

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Prettier
        run: npm install -g prettier

      - name: Format HTML (inline CSS + JS included)
        run: prettier --write "**/*.html"

      - name: Format JS if present
        run: prettier --write "**/*.js" || true

      - name: Format Code
        run: prettier --write .

      - name: Debug git state
        run: |
          echo "Current ref: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit info:" && git --no-pager log -1 --pretty=oneline || true
          echo "Changed files (porcelain):" && git status --porcelain || true
          echo "Diff names:" && git --no-pager diff --name-only || true

      - name: Commit and push if changed (exclude workflows)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # gather changed files (one per line)
          changed_files=$(git status --porcelain | sed -E 's/^.{3}//' || true)

          if [ -n "$changed_files" ]; then
            # add all changed files except anything under .github/workflows
            echo "$changed_files" | grep -v '^.github/workflows/' | while IFS= read -r f; do
              [ -n "$f" ] || continue
              git add -- "$f"
            done

            # commit only if there are staged changes (this avoids the workflow-update rejection)
            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "chore: auto format"
              git push origin HEAD
            else
              echo "No commitable changes (only workflow files changed or nothing to add)"
            fi
          else
            echo "No changes to commit"
          fi
