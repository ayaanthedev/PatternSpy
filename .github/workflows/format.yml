name: Auto Format

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Prettier
        run: npm install -g prettier

      - name: Format HTML (inline CSS + JS included)
        run: prettier --write "**/*.html"

      - name: Format JS if present
        run: prettier --write "**/*.js" || true

      - name: Format Code
        run: prettier --write .

      - name: Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Format code" || echo "No changes to commit"

      - name: Auto commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto format"
          file_pattern: "**/*.{html,js}"
