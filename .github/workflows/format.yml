name: Auto Format 

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Install Prettier globally
      - run: npm install -g prettier

      # 3. Run Prettier with parser overrides for inline CSS
      - run: |
          prettier --write "**/*.html" --parser html
          prettier --write "**/*.js" --parser babel
          prettier --write "**/*.css" --parser css

      # 4. Commit formatted files
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format code"
          branch: main
          file_pattern: "**/*.{html,css,js}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
