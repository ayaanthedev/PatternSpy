name: Auto Format

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Prettier
        run: npm install -g prettier

      - name: Format HTML (inline CSS + JS included)
        run: prettier --write "**/*.html"

      - name: Format JS if present
        run: prettier --write "**/*.js" || true

      - name: Format Code
        run: prettier --write .

      - name: Debug git state
        run: |
          echo "Current ref: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit info:" && git --no-pager log -1 --pretty=oneline || true
          echo "Changed files (porcelain):" && git status --porcelain || true
          echo "Diff names:" && git --no-pager diff --name-only || true

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto format"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi
