name: Format Code

on:
  push:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Run Prettier using the GitHub Action
      - name: Format HTML/CSS/JS
        uses: creyD/prettier_action@v4
        with:
          prettier_options: "--write '**/*.{html,css,js}'"

      # Step 3: Commit & Push changes automatically
      - name: Auto Commit Formatted Code
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-format code via Prettier"
          branch: main
          file_pattern: "**/*.{html,css,js}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
